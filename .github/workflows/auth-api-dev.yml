name: CI/CD - Auth API (Development)

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.x'
  PROJECT_PATH: Authentication.RefreshToken.Services.WebApi/Authentication.RefreshToken.Services.WebApi.csproj
  TEST_PROJECT_PATH: Authentication.RefreshToken.UnitTest/Authentication.RefreshToken.UnitTest.csproj
  PUBLISH_DIR: publish_output
  AZURE_WEBAPP_NAME: auth-api-dev

jobs:

  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code 🛎️
        uses: actions/checkout@v4

      - name: Setup .NET 🔧
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies 🛠️
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build app 🚀
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore
      
      - name: Run Unit Tests 🧪
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --no-build --verbosity normal

      - name: Publish app 📰
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-build

      - name: Upload build artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact 📦
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Deploy using Publish Profile 🚢
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
