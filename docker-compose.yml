services:
  api:
    container_name: auth-api
    build:
      context: .
      dockerfile: Authentication.RefreshToken.Services.WebApi/Dockerfile
    working_dir: /src
    ports:
      # - "8080:8080"
        - "7234:7234" 
    volumes:
      - ./:/src
      # WebApi
      - api_bin:/src/Authentication.RefreshToken.Services.WebApi/bin
      - api_obj:/src/Authentication.RefreshToken.Services.WebApi/obj

      # UseCases
      - usecases_bin:/src/Authentication.RefreshToken.Application.UseCases/bin
      - usecases_obj:/src/Authentication.RefreshToken.Application.UseCases/obj

      # Infrastructure
      - infra_bin:/src/Authentication.RefreshToken.Infrastructure/bin
      - infra_obj:/src/Authentication.RefreshToken.Infrastructure/obj

      # Persistence
      - persistence_bin:/src/Authentication.RefreshToken.Persistence/bin
      - persistence_obj:/src/Authentication.RefreshToken.Persistence/obj
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # Allowed Origins
      AllowedOrigins__0: "${ALLOWED_ORIGIN_0}"
      AllowedOrigins__1: "${ALLOWED_ORIGIN_1}"

      # Connection String
      ConnectionStrings__AuthRefreshTokenConnection: "${DB_CONNECTION}"

      # DefaultAdmin
      DefaultAdmin__Email: "${DEFAULT_ADMIN_EMAIL}"
      DefaultAdmin__Password: "${DEFAULT_ADMIN_PASSWORD}"

      # JWT
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__TokenExpiryMinutes: "${JWT_TOKEN_EXPIRY}"
      Jwt__RefreshTokenExpiryDays: "${JWT_REFRESH_EXPIRY}"

    # depends_on:
    #   - sqlserver
    restart: "no"

  # sqlserver:
  #   container_name: auth-sql
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     SA_PASSWORD: "P@ssw0rd1234"
