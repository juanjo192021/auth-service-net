  #     # SQL Server estará expuesto en el puerto 14330 (host - PC)
  #     # dentro del contenedor sigue siendo 1433
  #     - "14330:1433"
  #   volumes:
  #     - sql_data:/var/opt/mssql
  #   restart: "no"

volumes:
  # sql_data:
  api_bin:
  api_obj:
  usecases_bin:
  usecases_obj:
  infra_bin:
  infra_obj:
  persistence_bin:
  persistence_obj:
